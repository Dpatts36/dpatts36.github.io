<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Vietnam Travel Map</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    #map { position: absolute; inset: 0; }

    /* Legend / layer toggles */
    #legend {
      position: absolute; top: 10px; left: 10px; z-index: 2;
      background: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.2);
      font-size: 13px; max-width: 240px; overflow: hidden;
    }
    #legend-toggle {
      width: 100%; border: 0; background: #1f2d3d; color: #fff; font: inherit; font-weight: 600;
      padding: 9px 12px; text-align: left; cursor: pointer; display: flex; justify-content: space-between;
    }
    #legend-body { padding: 8px 12px 10px; }
    #legend.collapsed #legend-body { display: none; }
    #legend.collapsed #legend-toggle .chev { transform: rotate(-90deg); }
    .legend-section { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #777; margin: 8px 0 4px; }
    .legend-section:first-child { margin-top: 0; }
    .legend-row { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; user-select: none; }
    .legend-row input { margin: 0; }
    .swatch { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); flex: none; }
    .swatch.stop { width: 18px; height: 18px; background: #1f2d3d; color: #fff; font-size: 10px; font-weight: 700; display: grid; place-items: center; }
    .swatch.halo { background: transparent; border: 2.5px solid #f1c40f; box-shadow: none; }
    .swatch.border { width: 18px; height: 0; border-radius: 0; border: 0; border-top: 3px solid #ffd400;
                     box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
    .emoji-swatch {
      flex: none; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 1.5px solid #1f2d3d;
      display: grid; place-items: center; font-size: 13px; line-height: 1;
      font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
    }
    .emoji-swatch.big { width: 34px; height: 34px; font-size: 19px; }
    .list-btn {
      flex: 1; display: flex; align-items: center; gap: 6px; border: 0; background: none; padding: 2px 0;
      font: inherit; color: #1f2d3d; text-align: left; cursor: pointer;
    }
    .list-btn:hover { text-decoration: underline; }
    .list-btn .count { background: #eef1f4; color: #555; border-radius: 9px; padding: 0 6px; font-size: 11px; }
    .list-btn .arrow { margin-left: auto; color: #999; font-size: 16px; line-height: 1; }

    /* Trip-stop navigation bar */
    #stop-nav {
      position: absolute; left: 50%; transform: translateX(-50%); bottom: 36px; z-index: 2;
      max-width: calc(100% - 20px); display: flex; align-items: center; gap: 4px; padding: 5px;
      background: #fff; border-radius: 26px; box-shadow: 0 2px 12px rgba(0,0,0,.3); font-size: 13px;
    }
    #stop-chips { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
    #stop-chips::-webkit-scrollbar { display: none; }
    .stop-chip {
      flex: none; display: flex; align-items: center; gap: 6px; border: 0; cursor: pointer; font: inherit;
      background: #eef1f4; color: #1f2d3d; border-radius: 20px; padding: 4px 11px 4px 4px; white-space: nowrap;
    }
    .stop-chip:hover { background: #dde3ea; }
    .stop-chip .num {
      width: 24px; height: 24px; border-radius: 50%; background: #1f2d3d; color: #fff;
      display: grid; place-items: center; font-weight: 700; font-size: 12px;
    }
    .stop-chip.active { background: #1f2d3d; color: #fff; font-weight: 600; }
    .stop-chip.active .num { background: #ffd400; color: #1f2d3d; }
    .nav-arrow {
      flex: none; width: 32px; height: 32px; border-radius: 50%; border: 0; background: none; cursor: pointer;
      font-size: 22px; line-height: 1; color: #1f2d3d;
    }
    .nav-arrow:hover:not(:disabled) { background: #eef1f4; }
    .nav-arrow:disabled { color: #ccc; cursor: default; }

    /* Category list panel */
    #list-panel {
      position: absolute; top: 10px; bottom: 30px; right: 60px; z-index: 3; width: 380px;
      background: #fff; border-radius: 10px; box-shadow: 0 2px 14px rgba(0,0,0,.25);
      display: flex; flex-direction: column; overflow: hidden; font-size: 13px;
    }
    #list-panel[hidden] { display: none; }
    #list-panel header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #eee; }
    #list-panel header h2 { margin: 0; font-size: 16px; }
    #list-count { color: #777; font-size: 12px; }
    #list-close { margin-left: auto; border: 0; background: none; font-size: 22px; line-height: 1; cursor: pointer; color: #555; padding: 0 4px; }
    #list-body { overflow-y: auto; padding: 4px 14px 14px; -webkit-overflow-scrolling: touch; }
    .list-city h3 {
      position: sticky; top: 0; background: #fff; margin: 0; padding: 10px 0 6px; font-size: 14px; color: #1f2d3d;
      border-bottom: 2px solid #1f2d3d;
    }
    .list-city h3 span { color: #888; font-weight: 400; font-size: 12px; }
    .list-city table { width: 100%; border-collapse: collapse; margin-bottom: 6px; }
    .list-city th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #888; font-weight: 600; padding: 6px 6px 4px; }
    .list-city td { vertical-align: top; padding: 8px 6px; border-top: 1px solid #f0f0f0; }
    .list-city tbody tr { cursor: pointer; }
    .list-city tbody tr:hover, .list-city tbody tr:focus { background: #f5f8fb; outline: none; }
    .lc-name { font-weight: 600; width: 38%; }
    .lc-cat { font-weight: 400; color: #888; font-size: 11px; margin-top: 2px; }
    .lc-desc { color: #444; }
    .lc-addr { color: #777; font-size: 11px; margin-top: 3px; }
    .list-empty { color: #777; }

    @media (max-width: 600px) {
      #list-panel { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 60vh; border-radius: 14px 14px 0 0; }
    }

    /* Popups */
    .mapboxgl-popup-content { padding: 12px 14px; border-radius: 10px; font-size: 13px; line-height: 1.4; }
    .mapboxgl-popup-close-button { font-size: 20px; padding: 2px 8px; }
    .pp-kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; margin-bottom: 2px; }
    .pp-title { font-size: 15px; font-weight: 700; margin: 0 0 6px; padding-right: 18px; }
    .pp-meta { color: #555; margin: 4px 0; }
    .pp-note { color: #777; font-size: 12px; font-style: italic; margin-top: 6px; }
    .pp-alert { background: #fdecea; color: #a93226; border-radius: 6px; padding: 4px 8px; font-size: 12px; margin: 6px 0; }
    .pp-block { margin-top: 8px; }
    .pp-block b { display: block; font-size: 12px; color: #333; }
    .pp-block ul { margin: 2px 0 0; padding-left: 18px; }

    #token-warning {
      position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 3;
      background: #c0392b; color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 13px; display: none;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="legend">
    <button id="legend-toggle" type="button"><span>Vietnam Trip · Map key</span><span class="chev">▾</span></button>
    <div id="legend-body"></div>
  </div>

  <nav id="stop-nav" aria-label="Trip stops">
    <button id="stop-prev" class="nav-arrow" type="button" aria-label="Previous stop">‹</button>
    <div id="stop-chips"></div>
    <button id="stop-next" class="nav-arrow" type="button" aria-label="Next stop">›</button>
  </nav>

  <aside id="list-panel" hidden aria-labelledby="list-title">
    <header>
      <span id="list-swatch" class="emoji-swatch big"></span>
      <div>
        <h2 id="list-title"></h2>
        <div id="list-count"></div>
      </div>
      <button id="list-close" type="button" aria-label="Close list">×</button>
    </header>
    <div id="list-body"></div>
  </aside>

  <div id="token-warning">Add your Mapbox access token (<code>MAPBOX_TOKEN</code> in the script) to load the map.</div>

    function emojiBadge(emoji, rimColor) {
      const pixelRatio = 2;
      const size = 34 * pixelRatio;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const r = size / 2;

      ctx.beginPath();
      ctx.arc(r, r, r - 3 * pixelRatio, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.shadowColor = 'rgba(0,0,0,0.5)';
      ctx.shadowBlur = 3 * pixelRatio;
      ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.lineWidth = 2 * pixelRatio;
      ctx.strokeStyle = rimColor;
      ctx.stroke();

      ctx.textBaseline = 'middle';
      ctx.fillText(emoji, r, r + 1 * pixelRatio);

      const { data } = ctx.getImageData(0, 0, size, size);
      return { width: size, height: size, data, pixelRatio };

      map.addSource('stops', { type: 'geojson', data: fc(stops) });
      map.addSource('itin-places', { type: 'geojson', data: fc(itinPlaces) });
      map.addSource('guide', { type: 'geojson', data: fc(guidePlaces) });

      // Country border: no fill, bright yellow line over a dark casing so it reads on imagery
      map.addLayer({
        id: 'country-outline-casing',
        type: 'line',
        source: 'country',
        layout: { 'line-join': 'round' },
        paint: {
          'line-color': '#000',
          'line-opacity': 0.6,
          'line-width': ['interpolate', ['linear'], ['zoom'], 4, 4, 10, 7],
        },
      });
      map.addLayer({
        id: 'country-outline',
        type: 'line',
        source: 'country',
        layout: { 'line-join': 'round' },
        paint: {
          'line-color': BORDER_COLOR,
          'line-width': ['interpolate', ['linear'], ['zoom'], 4, 2, 10, 3.5],
        },
      });

      // Register one emoji badge image per category
      Object.entries(GROUPS).forEach(([key, g]) => {
        const img = emojiBadge(g.emoji, g.color);
        map.addImage(`cat-${key}`, img, { pixelRatio: img.pixelRatio });
      });

      // Itinerary highlights: a ring drawn around the place (gold = must-do)
      map.addLayer({
        id: 'itin-halo',
        type: 'circle',
        source: 'itin-places',
        minzoom: 8,
        paint: {
          'circle-radius': ['interpolate', ['linear'], ['zoom'], 8, 8, 12, 11, 16, 15],
          'circle-color': 'rgba(0,0,0,0)',
          'circle-stroke-width': 2.5,
          'circle-stroke-color': [
            'match', ['get', 'category'], 'must_do', MUST_DO_COLOR, '#ffffff',
          ],
        },
      });

      // Detailed guide points, drawn as emoji badges by symbol_group
      map.addLayer({
        id: 'guide-icons',
        type: 'symbol',
        source: 'guide',
        layout: {
          'icon-image': ['concat', 'cat-', ['get', 'symbol_group']],
          'icon-size': ['interpolate', ['linear'], ['zoom'], 5, 0.5, 9, 0.75, 14, 1],
          'icon-allow-overlap': true,
          'icon-ignore-placement': true,
        },
      });

      map.addLayer({
        id: 'guide-labels',
        type: 'symbol',
        source: 'guide',
        minzoom: 13,
        layout: {
          'text-field': ['get', 'name_en'],
          'text-font': FONT,
          'text-size': 12,
          'text-anchor': 'top',
          'text-offset': [0, 1.4],
          'text-max-width': 10,
          'text-optional': true,
        },
        paint: { 'text-color': '#fff', 'text-halo-color': 'rgba(0,0,0,0.85)', 'text-halo-width': 1.5 },
      });

      // Numbered itinerary stops
      map.addLayer({
        id: 'stop-circles',
        type: 'circle',
        source: 'stops',
        maxzoom: 12,
        paint: {
          'circle-color': STOP_COLOR,
          'circle-radius': 13,
          'circle-stroke-color': '#fff',
          'circle-stroke-width': 2,
        },
      });

      map.addLayer({
        id: 'stop-labels',
        type: 'symbol',
        source: 'stops',
        maxzoom: 12,
        layout: {
          'text-field': ['to-string', ['get', 'stop']],
          'text-font': FONT,
          'text-size': 13,
          'text-allow-overlap': true,
          'text-ignore-placement': true,
        },
        paint: { 'text-color': '#fff' },
      });

      map.addLayer({
        id: 'stop-names',
        type: 'symbol',
        source: 'stops',
        maxzoom: 12,
        layout: {
          'text-field': ['concat', ['get', 'name'], '\n', ['get', 'dates']],
          'text-font': FONT,
          'text-size': 12,
          'text-anchor': 'left',
          'text-offset': [1.4, 0],
          'text-justify': 'left',
        },
        paint: { 'text-color': '#fff', 'text-halo-color': 'rgba(0,0,0,0.85)', 'text-halo-width': 2 },
      });

      buildLegend();
      buildStopNav(stops, zoneBoundsFor(stops, [...itinPlaces, ...guidePlaces]));
    });

    // ---------------------------------------------------------------------------
    // Popups (one handler so overlapping layers don't open several popups)
    // ---------------------------------------------------------------------------

    const CLICK_LAYERS = ['stop-circles', 'guide-icons', 'itin-halo'];

    function featureAt(point) {
      const pad = 8; // generous hit area for fingers
      const box = [[point.x - pad, point.y - pad], [point.x + pad, point.y + pad]];
      const layers = CLICK_LAYERS.filter((id) => map.getLayer(id));
      const hits = map.queryRenderedFeatures(box, { layers });
      for (const id of CLICK_LAYERS) {
        const f = hits.find((h) => h.layer.id === id);
        if (f) return f;
      }
      return null;
    }

    map.on('mousemove', (e) => {
      map.getCanvas().style.cursor = featureAt(e.point) ? 'pointer' : '';
    });

    map.on('click', (e) => {
      const f = featureAt(e.point);
      if (!f) return;
      const coords = f.geometry.coordinates.slice();
      let html;
      if (f.layer.id === 'stop-circles') html = stopPopup(f.properties, coords);
      else if (f.layer.id === 'guide-icons') html = guidePopup(f.properties);
      else html = itinPlacePopup(f.properties);
      popup.setLngLat(coords).setHTML(html).addTo(map);
    });

    function stopPopup(p, coords) {
      const tips = cityTipsByCoord[coordKey(coords)];
      let tipsHtml = '';
      if (tips && tips.callout) {
        const lines = tips.callout.split('\n').slice(1).map((l) => l.replace(/^•\s*/, ''));
        tipsHtml = `<div class="pp-block"><b>City tips</b><ul>${lines.map((l) => `<li>${esc(l)}</li>`).join('')}</ul></div>`;
      }
      return `
        <div class="pp-kicker" style="color:${STOP_COLOR}">Stop ${esc(p.stop)} · ${esc(p.dates)} · ${esc(p.days)} day${p.days > 1 ? 's' : ''}</div>
        <div class="pp-title">${esc(p.name)}</div>
        ${p.top_activities ? `<div class="pp-block"><b>Top activities</b>${esc(p.top_activities)}</div>` : ''}
        ${p.must_do ? `<div class="pp-block"><b>⭐ Must do</b>${esc(p.must_do)}</div>` : ''}
        ${tipsHtml}
        <div class="pp-note">Zoom in to see individual places.</div>`;
    }

    function guidePopup(p) {
      const g = GROUPS[p.symbol_group] || { color: '#555', emoji: '📍' };
      const approx = p.confidence && p.confidence !== 'high';
      return `
        <div class="pp-kicker" style="color:${g.color}">${g.emoji} ${esc(p.city)} · ${esc(p.category)}</div>
        <div class="pp-title">${esc(p.name_en || p.name)}</div>
        ${p.symbol_group === 'food_alert' ? '<div class="pp-alert">⚠️ Tourist alert — heavily promoted, expect queues and higher prices.</div>' : ''}
        <div>${esc(p.description)}</div>
        ${p.address ? `<div class="pp-meta">📍 ${esc(p.address)}</div>` : ''}
        ${approx && p.note ? `<div class="pp-note">Approximate location: ${esc(p.note)}</div>` : ''}`;
    }

    function itinPlacePopup(p) {
      const mustDo = p.category === 'must_do';
      return `
        <div class="pp-kicker" style="color:${mustDo ? '#b7950b' : '#7f8c8d'}">${esc(p.region)} · Stop ${esc(p.stop)} · ${mustDo ? '⭐ Must do' : 'Itinerary'}</div>
        <div class="pp-title">${esc(p.name)}</div>
        ${p.address ? `<div class="pp-meta">📍 ${esc(p.address)}</div>` : ''}
        ${p.note ? `<div class="pp-note">${esc(p.note)}</div>` : ''}`;
    }

    // ---------------------------------------------------------------------------
    // Category list panel: places of one category, grouped by city (trip order)
    // ---------------------------------------------------------------------------

    const listPanel = document.getElementById('list-panel');
    const groupCheckboxes = {};

    function openList(groupKey) {
      const g = GROUPS[groupKey];
      const places = guidePlaces.filter((f) => f.properties.symbol_group === groupKey);

      // Group by city; guide file is already in trip order, so Map keeps that order
      const byCity = new Map();
      places.forEach((f) => {
        const city = f.properties.city;
        if (!byCity.has(city)) byCity.set(city, []);
        byCity.get(city).push(f);
      });

      document.getElementById('list-swatch').textContent = g.emoji;
      document.getElementById('list-title').textContent = g.label;
      document.getElementById('list-count').textContent =
        `${places.length} place${places.length === 1 ? '' : 's'} in ${byCity.size} cit${byCity.size === 1 ? 'y' : 'ies'}`;

      const body = document.getElementById('list-body');
      body.innerHTML = [...byCity.entries()].map(([city, feats]) => `
        <section class="list-city">
          <h3>${esc(city)} <span>${feats.length}</span></h3>
          <table>
            <thead><tr><th>Place</th><th>About</th></tr></thead>
            <tbody>
              ${feats.map((f) => `
                <tr data-id="${f.id}" tabindex="0">
                  <td class="lc-name">${esc(f.properties.name_en || f.properties.name)}
                    ${f.properties.category && f.properties.category !== 'Food' ? `<div class="lc-cat">${esc(f.properties.category)}</div>` : ''}
                  </td>
                  <td class="lc-desc">${esc(f.properties.description)}
                    ${f.properties.address ? `<div class="lc-addr">📍 ${esc(f.properties.address)}</div>` : ''}
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>
        </section>`).join('') || '<p class="list-empty">No places in this category.</p>';

      body.querySelectorAll('tr[data-id]').forEach((tr) => {
        const go = () => showPlace(Number(tr.dataset.id));
        tr.addEventListener('click', go);
        tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
      });

      body.scrollTop = 0;
      listPanel.hidden = false;
      if (isSmallScreen()) document.getElementById('legend').classList.add('collapsed');
    }

    function closeList() { listPanel.hidden = true; }

    function showPlace(id) {
      const f = guidePlaces.find((x) => x.id === id);
      if (!f) return;

      // Make sure the category is switched on so the point is visible
      const cb = groupCheckboxes[f.properties.symbol_group];
      if (cb && !cb.checked) { cb.checked = true; cb.dispatchEvent(new Event('change')); }

      if (isSmallScreen()) closeList();
      const coords = f.geometry.coordinates;
      map.flyTo({ center: coords, zoom: Math.max(map.getZoom(), 15), essential: true });
      popup.setLngLat(coords).setHTML(guidePopup(f.properties)).addTo(map);
    }

    document.getElementById('list-close').addEventListener('click', closeList);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeList(); });

    // ---------------------------------------------------------------------------
    // Legend with layer toggles + list buttons
    // ---------------------------------------------------------------------------

    function buildLegend() {
      const body = document.getElementById('legend-body');
      const activeGroups = new Set(Object.keys(GROUPS));

      const row = (swatchHtml, label, onChange) => {
        const el = document.createElement('label');
        el.className = 'legend-row';
        el.innerHTML = `<input type="checkbox" checked>${swatchHtml}<span>${esc(label)}</span>`;
        el.querySelector('input').addEventListener('change', (e) => onChange(e.target.checked));
        return el;
      };
      const section = (title) => {
        const el = document.createElement('div');
        el.className = 'legend-section';
        el.textContent = title;
        return el;
      };
      const setVis = (ids, on) => ids.forEach((id) =>
        map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none'));

      body.appendChild(section('Itinerary'));
      body.appendChild(row('<span class="swatch stop">1</span>', 'Trip stops',
        (on) => setVis(['stop-circles', 'stop-labels', 'stop-names'], on)));
      body.appendChild(row('<span class="swatch halo"></span>', 'Itinerary highlights (gold = must do)',
        (on) => setVis(['itin-halo'], on)));
      body.appendChild(row('<span class="swatch border"></span>', 'Country border',
        (on) => setVis(['country-outline', 'country-outline-casing'], on)));

      body.appendChild(section('Places · tap a name for the list'));
      const applyGroupFilter = () => {
        const filter = ['in', ['get', 'symbol_group'], ['literal', [...activeGroups]]];
        map.setFilter('guide-icons', filter);
        map.setFilter('guide-labels', filter);
      };
      Object.entries(GROUPS).forEach(([key, g]) => {
        const count = guidePlaces.filter((f) => f.properties.symbol_group === key).length;
        const el = document.createElement('div');
        el.className = 'legend-row';
        el.innerHTML = `
          <input type="checkbox" checked aria-label="Show ${esc(g.label)} on map">
          <span class="emoji-swatch" style="border-color:${g.color}">${g.emoji}</span>
          <button type="button" class="list-btn">${esc(g.label)} <span class="count">${count}</span><span class="arrow">›</span></button>`;
        const cb = el.querySelector('input');
        groupCheckboxes[key] = cb;
        cb.addEventListener('change', () => {
          cb.checked ? activeGroups.add(key) : activeGroups.delete(key);
          applyGroupFilter();
        });
        el.querySelector('.list-btn').addEventListener('click', () => openList(key));
        body.appendChild(el);
      });

      // Collapse by default on small screens
      const legend = document.getElementById('legend');
      if (isSmallScreen()) legend.classList.add('collapsed');
      document.getElementById('legend-toggle').addEventListener('click', () =>
        legend.classList.toggle('collapsed'));
    }

    // ---------------------------------------------------------------------------
    // Trip-stop navigation: one button per stop zooms to that zone
    // ---------------------------------------------------------------------------

    // Padding for fitBounds that keeps zones clear of the legend and the stop bar
    function fitPadding() {
      const legendOpen = !document.getElementById('legend').classList.contains('collapsed');
      const small = isSmallScreen();
      return {
        top: small ? 60 : 50,
        bottom: small ? 110 : 100,
        left: !small && legendOpen ? 270 : 30,
        right: small ? 30 : 60,
      };
    }

    // Each zone = its stop point + every place belonging to it. Itinerary places carry
    // a `stop` number; guide places are assigned to the nearest stop (e.g. Da Nang
    // sights → stop 5 "Hoi An & Da Nang", Cu Chi Tunnels → stop 8 Saigon).
    function zoneBoundsFor(stops, places) {
      const zones = new Map(stops.map((s) => {
        const c = s.geometry.coordinates;
        return [s.properties.stop, new mapboxgl.LngLatBounds(c, c)];
      }));
      const nearestStop = ([x, y]) => stops.reduce((best, s) => {
        const [sx, sy] = s.geometry.coordinates;
        const d = (sx - x) ** 2 + (sy - y) ** 2;
        return d < best.d ? { d, stop: s.properties.stop } : best;
      }, { d: Infinity }).stop;

      places.forEach((f) => {
        const stop = f.properties.stop ?? nearestStop(f.geometry.coordinates);
        zones.get(stop)?.extend(f.geometry.coordinates);
      });
      return zones;
    }

    function buildStopNav(stops, zones) {
      const chipsEl = document.getElementById('stop-chips');
      const prevBtn = document.getElementById('stop-prev');
      const nextBtn = document.getElementById('stop-next');
      // index -1 = whole country, 0..n-1 = stops in trip order
      let current = -1;

      const shortName = (n) => n.replace(/\s*\(.*\)\s*/, '');
      const chips = [
        `<button type="button" class="stop-chip" data-i="-1" title="Whole country"><span class="num">🇻🇳</span><span class="nm">All</span></button>`,
        ...stops.map((s, i) => `
          <button type="button" class="stop-chip" data-i="${i}" title="${esc(s.properties.name)} · ${esc(s.properties.dates)}">
            <span class="num">${esc(s.properties.stop)}</span><span class="nm">${esc(shortName(s.properties.name))}</span>
          </button>`),
      ];
      chipsEl.innerHTML = chips.join('');

      function goTo(i) {
        current = i;
        popup.remove();
        if (isSmallScreen()) closeList();

        if (i < 0) {
          map.fitBounds(countryBounds, { padding: fitPadding(), duration: 1500 });
        } else {
          const b = zones.get(stops[i].properties.stop);
          const sw = b.getSouthWest(), ne = b.getNorthEast();
          if (sw.lng === ne.lng && sw.lat === ne.lat) {
            // Single-point zone (e.g. Ha Long Bay): show the wider area
            map.flyTo({ center: b.getCenter(), zoom: 10, duration: 1500, essential: true });
          } else {
            map.fitBounds(b, { padding: fitPadding(), maxZoom: 15, duration: 1500 });
          }
        }

        chipsEl.querySelectorAll('.stop-chip').forEach((c) => {
          const active = Number(c.dataset.i) === i;
          c.classList.toggle('active', active);
          c.setAttribute('aria-pressed', active);
          if (active) c.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        });
        prevBtn.disabled = i <= -1;
        nextBtn.disabled = i >= stops.length - 1;
      }

      chipsEl.addEventListener('click', (e) => {
        const chip = e.target.closest('.stop-chip');
        if (chip) goTo(Number(chip.dataset.i));
      });
      prevBtn.addEventListener('click', () => goTo(Math.max(-1, current - 1)));
      nextBtn.addEventListener('click', () => goTo(Math.min(stops.length - 1, current + 1)));

      // Mark "All" active without moving the map (we're already at country extent)
      chipsEl.querySelector('[data-i="-1"]').classList.add('active');
      prevBtn.disabled = true;
    }
  </script>
</body>
</html>
